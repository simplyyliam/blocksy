# Builds Blocksy installers when a version tag (v0.1.0, ...) is pushed by `pnpm release`,
# signs the auto-update, and attaches everything plus latest.json to a DRAFT release.
# Publishing the draft (by hand, after testing) is what makes installed copies update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the draft release and upload files

jobs:
  # Creates the draft release ONCE, before the builds. Without this, the three build jobs
  # each saw "no release yet" at the same moment and all tried to create it; only the first
  # won and the other two failed (v0.1.1). Now they only upload into this one draft.
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo "body<<BLOCKSY_NOTES"
            node scripts/changelog-section.mjs "${GITHUB_REF_NAME}"
            echo "BLOCKSY_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release (or reuse it when a run is retried)
        id: release
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "")
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo)
            const existing = releases.find((r) => r.tag_name === tag)
            if (existing) return existing.id
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Blocksy ${tag}`,
              body: process.env.BODY,
              draft: true,
              prerelease: false,
            })
            return data.id

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed apps trust it (see scripts/updater-keygen.mjs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Upload into the draft made by create-release (never create one here).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true # latest.json: what installed apps check
          args: ${{ matrix.args }}

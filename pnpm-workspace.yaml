# Every folder matched here is a workspace package: pnpm links them together
# so `@blocksy/core` resolves to packages/core instead of the npm registry.
packages:
  - apps/*
  - packages/*
  - packages/targets/*
  - packages/elements/*
  - packages/nodes/*

# pnpm 10 blocks dependency install scripts unless listed. unrs-resolver's
# script only downloads a native binary it already ships, so we skip it.
ignoredBuiltDependencies:
  - unrs-resolver
